<main class="auth-layout">
  <section class="auth-card" aria-labelledby="login-title">
    <p class="eyebrow">SNAPGASTO</p>
    <h1 id="login-title">{{ registerMode() ? 'Crea tu cuenta' : 'Bienvenido' }}</h1>
    <h2>Gestiona tus ingresos</h2>

    <app-auth-credentials-form
      [mode]="registerMode() ? 'register' : 'login'"
      [loading]="loading()"
      [errorMessage]="message()"
      (submitted)="authenticate($event)"
    />

    <button class="button button-link" type="button" [disabled]="loading()" (click)="toggleMode()">
      {{ registerMode() ? 'Ya tengo una cuenta' : 'Crear la primera cuenta' }}
    </button>
  </section>
</main>
