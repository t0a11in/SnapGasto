<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/incomes"><span>◈</span> SnapGasto</a>
    <p class="sidebar-caption">{{ sessionStore.isAdmin() ? 'ADMINISTRACIÓN' : 'MI DINERO' }}</p>
    <nav aria-label="Mantenedores">
      @if (sessionStore.isAdmin()) {
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-item"><span aria-hidden="true">👥</span>Usuarios</a>
        <a routerLink="/admin/expenses" routerLinkActive="active" class="nav-item"><span aria-hidden="true">▣</span>Gastos</a>
      }
      <a routerLink="/incomes" routerLinkActive="active" class="nav-item"><span aria-hidden="true">↗</span>Ingresos</a>
      @if (sessionStore.isAdmin()) {
        <a routerLink="/admin/categories" routerLinkActive="active" class="nav-item"><span aria-hidden="true">◉</span>Categorías</a>
        <a routerLink="/admin/notifications" routerLinkActive="active" class="nav-item"><span aria-hidden="true">✉</span>Notificaciones</a>
      }
    </nav>

    @if (sessionStore.user(); as user) {
      <section class="account-summary">
        <strong>{{ user.fullName }}</strong>
        <span>{{ user.email }}</span>
        <span class="role-badge">{{ user.role }}</span>
        <button class="button button-link" type="button" (click)="logout()">Cerrar sesión</button>
      </section>
    }
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
