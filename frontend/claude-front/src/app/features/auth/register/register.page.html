<app-auth-layout title="Crea tu cuenta" subtitle="Empieza a registrar tus movimientos en segundos.">
  @if (serverError()) {
    <div class="alert alert-danger py-2" role="alert">{{ serverError() }}</div>
  }

  <form novalidate (submit)="onSubmit($event)">
    <div class="mb-3">
      <label class="form-label" for="register-name">Nombre completo</label>
      <input
        id="register-name"
        type="text"
        class="form-control"
        autocomplete="name"
        [class.is-invalid]="nameInvalid()"
        [formField]="registerForm.fullName"
      />
      <app-field-errors [field]="registerForm.fullName" />
    </div>

    <div class="mb-3">
      <label class="form-label" for="register-email">Correo electrónico</label>
      <input
        id="register-email"
        type="email"
        class="form-control"
        autocomplete="email"
        [class.is-invalid]="emailInvalid()"
        [formField]="registerForm.email"
      />
      <app-field-errors [field]="registerForm.email" />
    </div>

    <div class="mb-3">
      <app-password-input [field]="registerForm.password" autocomplete="new-password" [hint]="passwordHint" />
    </div>

    <div class="mb-4">
      <app-password-input
        [field]="registerForm.confirmPassword"
        label="Repite la contraseña"
        autocomplete="new-password"
      />
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm().submitting()">
      @if (registerForm().submitting()) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      }
      Crear cuenta
    </button>
  </form>

  <p class="text-center mt-4 mb-0">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
  </p>
</app-auth-layout>
