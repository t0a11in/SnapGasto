<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
  <div>
    <h1 class="h3 mb-1">{{ title() }}</h1>
    <p class="text-body-secondary mb-0">{{ subtitle() }}</p>
  </div>
  <div class="d-flex flex-wrap gap-2 align-items-center">
    <ng-content />
    <button type="button" class="btn btn-outline-secondary" (click)="refresh.emit()" aria-label="Recargar">
      <app-icon name="refresh-cw" [size]="16" />
    </button>
    <button type="button" class="btn btn-primary d-flex align-items-center gap-1" (click)="create.emit()">
      <app-icon name="plus" /> {{ createLabel() }}
    </button>
  </div>
</div>
