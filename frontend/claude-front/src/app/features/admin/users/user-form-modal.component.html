<form novalidate (submit)="onSubmit($event)">
  <div class="modal-header">
    <h2 class="modal-title h5" id="user-modal-title">{{ editingId() ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
    <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
  </div>
  <div class="modal-body">
    @if (serverError()) {
      <div class="alert alert-danger py-2" role="alert">{{ serverError() }}</div>
    }
    <div class="mb-3">
      <label class="form-label" for="user-name">Nombre completo</label>
      <input id="user-name" type="text" class="form-control"
        [class.is-invalid]="userForm.fullName().touched() && userForm.fullName().invalid()"
        [formField]="userForm.fullName" />
      <app-field-errors [field]="userForm.fullName" />
    </div>
    <div class="mb-3">
      <label class="form-label" for="user-email">Correo</label>
      <input id="user-email" type="email" class="form-control" autocomplete="off"
        [class.is-invalid]="userForm.email().touched() && userForm.email().invalid()"
        [formField]="userForm.email" />
      <app-field-errors [field]="userForm.email" />
    </div>
    <div class="mb-3">
      <label class="form-label" for="user-role">Rol</label>
      <select id="user-role" class="form-select" [formField]="userForm.role">
        <option value="USER">Usuario</option>
        <option value="ADMIN">Administrador</option>
      </select>
    </div>
    <app-password-input
      [field]="userForm.password"
      autocomplete="new-password"
      [label]="editingId() ? 'Nueva contraseña (opcional)' : 'Contraseña'"
      [hint]="editingId() ? 'Déjala vacía para mantener la actual. Mínimo 8 caracteres.' : 'Mínimo 8 caracteres.'"
    />
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="userForm().submitting()">Guardar</button>
  </div>
</form>
