<section class="row g-3" aria-label="Resumen del mes">
  <div class="col-sm-4">
    <div class="card stat-card h-100">
      <div class="card-body">
        <div class="text-body-secondary small">Total del mes</div>
        <div class="fs-3 fw-bold text-success">{{ summary()?.total ?? 0 | money }}</div>
      </div>
    </div>
  </div>
  <div class="col-sm-4">
    <div class="card stat-card h-100">
      <div class="card-body">
        <div class="text-body-secondary small">Tarjeta</div>
        <div class="fs-4 fw-semibold">{{ summary()?.totalTarjeta ?? 0 | money }}</div>
      </div>
    </div>
  </div>
  <div class="col-sm-4">
    <div class="card stat-card h-100">
      <div class="card-body">
        <div class="text-body-secondary small">Físico</div>
        <div class="fs-4 fw-semibold">{{ summary()?.totalFisico ?? 0 | money }}</div>
      </div>
    </div>
  </div>
</section>
