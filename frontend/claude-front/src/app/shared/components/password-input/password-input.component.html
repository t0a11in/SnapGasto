<label class="form-label" [for]="inputId">{{ label() }}</label>
<div class="password-field">
  <input
    class="form-control"
    [id]="inputId"
    [type]="visible() ? 'text' : 'password'"
    [attr.autocomplete]="autocomplete()"
    [class.is-invalid]="invalid()"
    [attr.aria-describedby]="invalid() ? errorId : hint() ? hintId : null"
    [formField]="field()"
  />
  <button
    type="button"
    class="password-toggle"
    (click)="toggle()"
    [attr.aria-pressed]="visible()"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    [attr.aria-controls]="inputId"
    [attr.title]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
  >
    <app-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="18" />
  </button>
</div>
<app-field-errors [field]="field()" [errorId]="errorId" />
@if (hint() && !invalid()) {
  <div class="form-text" [id]="hintId">{{ hint() }}</div>
}
