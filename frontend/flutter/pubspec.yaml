# Configuración de dependencias y metadatos de la aplicación Flutter SnapGasto.
name: snap_gasto
description: Aplicación multiplataforma para el registro y control de gastos personales mediante OCR.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado global, navegación, inyección de dependencias y middlewares.
  get: ^4.7.3
  get_storage: ^2.1.1

  # Cliente HTTP, registro de solicitudes y conectividad.
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0

  # Captura, selección, tratamiento y reconocimiento de comprobantes.
  camera: ^0.11.2+1
  image_picker: ^1.2.1
  image: ^4.7.2
  google_mlkit_text_recognition: ^0.15.0

  # Recursos visuales y gráficos del dashboard.
  fl_chart: ^1.1.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.2

  # Notificaciones push e internas en el dispositivo.
  firebase_core: ^4.3.0
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0

  # Utilidades de dominio y presentación.
  intl: ^0.20.2
  equatable: ^2.0.8
  logger: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Los recursos se declararán aquí a medida que se incorporen al proyecto.
  # assets:
  #   - assets/images/
  #   - assets/animations/
