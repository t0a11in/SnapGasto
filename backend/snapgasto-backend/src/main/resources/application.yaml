spring:
  application:
    name: snapgasto-backend
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:snap_gastos};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # La base local ya contiene el esquema equivalente a V1--V4, creado
    # previamente por Hibernate. Flyway la adopta desde V4 y aplica V5.
    baseline-on-migrate: true
    baseline-version: 4
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  # Zona horaria de negocio: define "hoy" y "este mes" para los proyectos.
  time-zone: ${APP_TIME_ZONE:America/Santiago}
  projects:
    # Tarea diaria: registra gastos recurrentes y envía avisos previos (06:00).
    daily-cron: ${PROJECTS_DAILY_CRON:0 0 6 * * *}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  security:
    jwt:
      # Sin valor por defecto: la API no arranca si JWT_SECRET no está definido.
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
      # Duración máxima de una sesión aunque se renueve el token con /refresh.
      max-session-hours: ${JWT_MAX_SESSION_HOURS:168}
    login-attempts:
      # Intentos fallidos por correo antes de bloquear temporalmente el login.
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    rate-limit:
      # Solicitudes por minuto y por IP a login, registro y acceso con Google.
      auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    # Limpieza diaria de tokens revocados que ya expiraron (03:15).
    revoked-token-cleanup-cron: ${REVOKED_TOKEN_CLEANUP_CRON:0 15 3 * * *}
