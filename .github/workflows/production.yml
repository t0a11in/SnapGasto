# Pipeline de SnapGasto hacia producción.
#
#  Pull request a "production"  → pruebas de backend (Java), web (Angular) y móvil (Flutter).
#  Push/merge a "production"    → pruebas → imágenes Docker en GHCR → despliegue (API + web).
#
# El despliegue solo corre cuando la variable de repositorio PROD_DEPLOY_ENABLED
# vale "true" y espera la aprobación configurada en el environment "production".
# Configuración paso a paso: deploy/README.md

name: Producción

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

# Si llegan dos pushes seguidos, se cancela el pipeline anterior (nunca un despliegue en curso).
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/snapgasto-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas (JUnit + Mockito + integración con H2)
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress test
      - name: Reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/snapgasto-backend/target/surefire-reports

  frontend:
    name: Front · build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/claude-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular 22 exige Node ^22.22.3 o ^24.15.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/claude-front/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Pruebas (Karma + Jasmine en Chrome headless)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Build de producción
        run: npm run build -- --configuration production

  flutter:
    name: Flutter · análisis y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/claude_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas (flutter_test + bloc_test)
        run: flutter test

  images:
    name: Imágenes Docker
    # La app móvil no se despliega en el servidor, pero si sus pruebas fallan no se publica nada.
    needs: [backend, frontend, flutter]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API (Spring Boot)
        uses: docker/build-push-action@v6
        with:
          context: backend/snapgasto-backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/snapgasto-api:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/snapgasto-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web (Angular SSR)
        uses: docker/build-push-action@v6
        with:
          context: frontend/claude-front
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/snapgasto-web:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/snapgasto-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Despliegue a producción
    needs: images
    if: github.event_name != 'pull_request' && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # En Settings → Environments → production puedes exigir aprobación manual.
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Copiar configuración al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          source: deploy/compose.prod.yaml,deploy/Caddyfile
          target: ${{ vars.PROD_DEPLOY_PATH }}
          strip_components: 1
      - name: Actualizar contenedores
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          envs: IMAGE_TAG,IMAGE_PREFIX,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env || { echo "Falta $DEPLOY_PATH/.env (ver deploy/.env.example)"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG IMAGE_PREFIX
            docker compose -f compose.prod.yaml pull api web
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
            echo "Desplegado $IMAGE_TAG"
      - name: Verificar que responde
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.PROD_DOMAIN }}/" || true)
            if [ "$code" = "200" ]; then echo "OK ($code)"; exit 0; fi
            echo "Intento $i: $code"; sleep 10
          done
          echo "El sitio no respondió 200 después del despliegue"; exit 1
